version: '3.8'

services:

  user-service:
    build: ../user-service     # or absolute: D:/Migrate_Microservices/user-service
    container_name: user-service
    ports:
      - "8081:8081"
    networks:
      - springnet
    depends_on:
      - discovery-service

  product-service:
    build: ../product-service
    container_name: product-service
    ports:
      - "8082:8082"
    networks:
      - springnet
    depends_on:
      - discovery-service

  cart-service:
    build: ../cart-service
    container_name: cart-service
    ports:
      - "8083:8083"
    networks:
      - springnet
    depends_on:
      - discovery-service

  gateway-service:
    build: ../gateway-service
    container_name: gateway-service
    ports:
      - "8080:8080"
    networks:
      - springnet
    depends_on:
      - discovery-service

  discovery-service:
    build: ../discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    networks:
      - springnet

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - springnet

networks:
  springnet:

volumes:
  mongo_data:
